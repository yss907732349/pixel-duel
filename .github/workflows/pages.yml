name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify rules and room service
        run: |
          npm ci
          npm test
      - name: Prepare public files
        env:
          DUEL_SERVER_URL: ${{ vars.DUEL_SERVER_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.mkdirSync('_site', { recursive: true });
          for (const name of ['index.html', 'animation-preview.html', 'style.css', 'js', 'vendor']) {
            fs.cpSync(name, path.join('_site', name), { recursive: true });
          }
          const url = (process.env.DUEL_SERVER_URL || '').trim();
          if (url) {
            const parsed = new URL(url);
            if (parsed.protocol !== 'https:' || parsed.username || parsed.password || parsed.search || parsed.hash) {
              throw new Error('DUEL_SERVER_URL must be an HTTPS server URL without credentials, query, or fragment.');
            }
          }
          fs.writeFileSync('_site/js/deploy-config.js', `window.DUEL_SERVER_URL = ${JSON.stringify(url)};\n`);
          fs.writeFileSync('_site/.nojekyll', '');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逐影 · 像素动作工坊</title>
<style>
:root{color-scheme:dark;--ink:#dbe4d5;--muted:#8fa69b;--line:#354b43;--accent:#78e1d6}*{box-sizing:border-box}body{margin:0;background:#152622;color:var(--ink);font:14px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1160px;margin:auto;padding:36px 28px}a{color:var(--accent);text-decoration:none}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px}h1{font:600 30px/1.4 'Microsoft YaHei',sans-serif;margin:4px 0}p{margin:6px 0;color:var(--muted)}.toolbar{display:flex;gap:14px;flex-wrap:wrap;padding:24px 0;align-items:end}label{display:grid;gap:5px;color:var(--muted);font-size:12px}select,button{font:inherit;color:var(--ink);background:#213b32;border:1px solid #4b6558;border-radius:4px;padding:9px 14px;cursor:pointer}button:hover,select:hover{background:#2e4b3e}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stage{display:grid;grid-template-columns:1fr 300px;gap:28px}.canvasbox{background:repeating-conic-gradient(#20342e 0% 25%,#263e35 0% 50%) 50% /24px 24px;border:1px solid var(--line);border-radius:6px;overflow:auto;padding:24px;min-height:330px;display:grid;place-items:center}canvas{image-rendering:pixelated;max-width:100%}aside{border-left:1px solid var(--line);padding-left:26px}h2{font-size:16px;margin:0 0 15px}.stat{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted)}.stat strong{color:var(--ink);font-weight:400}.sheethead{display:flex;justify-content:space-between;align-items:end;margin:30px 0 14px}.sheetbox{background:repeating-conic-gradient(#20342e 0% 25%,#263e35 0% 50%) 50% /16px 16px;border:1px solid var(--line);padding:20px;overflow:auto}.sheetbox canvas{max-width:none}footer{padding:24px 0;color:var(--muted);font-size:12px}.legend{display:flex;gap:20px;margin-top:14px;color:var(--muted);font-size:12px}#play{min-width:80px}.note{font-size:12px;margin-top:18px}#frameCount{font-variant-numeric:tabular-nums}@media(max-width:760px){main{padding:24px 16px}.stage{grid-template-columns:1fr}aside{border-left:0;padding-left:0}.canvasbox{min-height:260px}header{align-items:start;gap:12px}h1{font-size:25px}.sheethead{align-items:start;gap:12px}}
</style>
</head>
<body>
<main>
<header><div><a href="index.html">返回逐影对战</a><h1>像素动作工坊</h1><p>同一位剑士，每一个朝向、每一帧都可以仔细看。</p></div><a href="index.html">进入试炼场 ↗</a></header>
<div class="toolbar">
<label>动作<select id="action"></select></label>
<label>角色<select id="palette"><option value="0">青岚 · 青色</option><option value="1">赤烬 · 珊瑚色</option></select></label>
<label>朝向<select id="facing"><option value="right">右</option><option value="down">下</option><option value="left">左</option><option value="up">上</option></select></label>
<label>播放速度<select id="speed"><option value="1">正常速度</option><option value="0.5">半速 0.5×</option><option value="0.25">慢放 0.25×</option><option value="0.1">逐帧观察 0.1×</option></select></label>
<label>像素倍率<select id="zoom"><option value="6">6× 放大</option><option value="4">4× 检查</option><option value="1">1× 原生像素</option></select></label>
<div class="actions"><button id="prev" type="button" aria-label="上一帧">← 上一帧</button><button id="play" type="button">暂停</button><button id="next" type="button" aria-label="下一帧">下一帧 →</button></div>
</div>
<section class="stage"><div class="canvasbox"><canvas id="preview" width="576" height="400" aria-label="当前动作放大预览"></canvas></div><aside><h2 id="actionName">动作预览</h2><div class="stat"><span>当前帧</span><strong id="frameCount"></strong></div><div class="stat"><span>源帧尺寸</span><strong>64 × 64 px</strong></div><div class="stat"><span>角色占幅</span><strong>约 32 × 40 px</strong></div><div class="stat"><span>脚底锚点</span><strong>32, 48</strong></div><div class="stat"><span>播放帧率</span><strong id="fps"></strong></div><div class="stat"><span>帧数</span><strong id="frames"></strong></div><p class="note">实战中的起手、命中与收势会对齐技能预警时间。本页循环播放完整动作，方便检查动作衔接。</p><p class="note">方向键 ← → 单帧步进，空格暂停。锚点十字表示统一脚底位置，四向图集使用同一个基准。</p></aside></section>
<div class="sheethead"><div><h2 style="margin:0">四向逐帧图集</h2><p>从上到下：下、左、右、上。透明底，原生像素导出。</p></div><div class="actions"><button id="export" type="button">导出 PNG 图集</button><button id="export-json" type="button">导出 JSON 帧数据</button></div></div>
<div class="sheetbox"><canvas id="sheet" aria-label="四个朝向的逐帧动作图集"></canvas></div>
<div class="legend"><span>轮廓不抖动</span><span>披风与围巾延迟摆动</span><span>所有帧固定体型与脚底锚点</span></div>
<footer>所有人物、装备与动作均由可编辑的像素绘制规则与姿势表构成。</footer>
</main>
<script src="js/pixel-actor.js"></script>
<script>
(function(){
'use strict';
const A=window.PixelActor,$=id=>document.getElementById(id),action=$('action'),palette=$('palette'),facing=$('facing'),speed=$('speed'),preview=$('preview'),ctx=preview.getContext('2d'),sheet=$('sheet');
for(const [key,m] of Object.entries(A.META)){const o=document.createElement('option');o.value=key;o.textContent=m.label;action.appendChild(o)}
let clock=0,last=performance.now(),playing=true,currentFrame=0;
function updateSheet(){
const image=A.sheet(action.value,Number(palette.value),2);sheet.width=image.width;sheet.height=image.height;sheet.getContext('2d').drawImage(image,0,0);
$('actionName').textContent=A.META[action.value].label;$('fps').textContent=A.META[action.value].fps+' fps';$('frames').textContent=A.POSES[action.value].length+' 帧';
clock=0;currentFrame=0;draw();
}
function draw(){
ctx.clearRect(0,0,preview.width,preview.height);ctx.imageSmoothingEnabled=false;
const image=A.sprite(action.value,facing.value,currentFrame,Number(palette.value)),scale=Number($('zoom').value),x=Math.round((preview.width-A.WIDTH*scale)/2),y=Math.round((preview.height-A.HEIGHT*scale)/2);
ctx.globalAlpha=.5;ctx.fillStyle='#0d221c';ctx.fillRect(x+(A.ANCHOR.x-9)*scale,y+(A.ANCHOR.y+1)*scale,20*scale,2*scale);ctx.globalAlpha=1;
ctx.strokeStyle='#78e1d655';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y+A.ANCHOR.y*scale+.5);ctx.lineTo(preview.width,y+A.ANCHOR.y*scale+.5);ctx.stroke();
ctx.drawImage(image,x,y,A.WIDTH*scale,A.HEIGHT*scale);
const ax=x+A.ANCHOR.x*scale,ay=y+A.ANCHOR.y*scale;ctx.fillStyle='#e8cd87';ctx.fillRect(ax-3,ay,7,1);ctx.fillRect(ax,ay-3,1,7);
$('frameCount').textContent=String(currentFrame+1).padStart(2,'0')+' / '+String(A.POSES[action.value].length).padStart(2,'0');
}
function step(delta){playing=false;$('play').textContent='播放';const n=A.POSES[action.value].length;currentFrame=(currentFrame+delta+n)%n;clock=currentFrame/A.META[action.value].fps;draw()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};
action.onchange=updateSheet;palette.onchange=updateSheet;facing.onchange=draw;
$('zoom').onchange=draw;
$('export').onclick=()=>{const c=A.sheet(action.value,Number(palette.value),1),link=document.createElement('a');link.download='taiting-'+action.value+'-'+palette.value+'-'+A.WIDTH+'x'+A.HEIGHT+'.png';link.href=c.toDataURL('image/png');link.click()};
$('export-json').onclick=()=>{const meta=A.metadata(action.value,Number(palette.value)),link=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(meta,null,2)],{type:'application/json'}));link.download=meta.name+'.json';link.href=url;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='ArrowLeft'){e.preventDefault();step(-1)}if(e.code==='ArrowRight'){e.preventDefault();step(1)}if(e.code==='Space'){e.preventDefault();$('play').click()}});
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){clock+=dt*Number(speed.value);currentFrame=Math.floor(clock*A.META[action.value].fps)%A.POSES[action.value].length;draw()}requestAnimationFrame(tick)}
updateSheet();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
